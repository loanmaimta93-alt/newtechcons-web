<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Quản trị nội dung — Newtechcons</title>
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Manrope:wght@600;700;800&family=Oswald:wght@600;700&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --navy: #1368b3;
    --navy-deep: #144a89;
    --navy-100: #dceefc;
    --navy-50: #f2f9ff;
    --red: #f55350;
    --red-dark: #e33a35;
    --paper: #f9fcff;
    --border: #dceefc;
    --ink: #101820;
    --font-sans: 'Inter', 'Segoe UI', system-ui, sans-serif;
    --font-display: 'Manrope', 'Segoe UI', system-ui, sans-serif;
    --font-logo: 'Oswald', 'Manrope', sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--paper);
    color: var(--ink);
  }
  h1, h2, h3 { font-family: var(--font-display); }
  header.top {
    background: #fff;
    color: var(--ink);
    padding: 14px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--navy-100);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  header.top .brand { display: flex; align-items: center; gap: 10px; }
  header.top .brand img { height: 32px; width: auto; }
  header.top .brand .wordmark {
    font-family: var(--font-logo);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.01em;
    font-size: 16px;
    line-height: 1;
  }
  header.top .brand .wordmark .new { color: var(--navy); }
  header.top .brand .wordmark .tech { color: var(--red); }
  header.top .brand .sep { color: #98a2b3; font-size: 13px; margin-left: 4px; }
  header.top .brand .label { color: #667085; font-size: 13px; }
  header.top h1 { font-size: 16px; margin: 0; font-weight: 700; }
  header.top button {
    background: var(--red);
    border: none;
    color: #fff;
    padding: 8px 16px;
    border-radius: 2px;
    cursor: pointer;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  header.top button:hover { background: var(--red-dark); }
  #login-screen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: var(--paper);
  }
  #login-screen .brand-mark {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    margin-bottom: 24px;
  }
  #login-screen .brand-mark img { height: 48px; width: auto; }
  #login-screen .brand-mark .wordmark {
    font-family: var(--font-logo);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    font-size: 20px;
  }
  #login-screen .brand-mark .wordmark .new { color: var(--navy); }
  #login-screen .brand-mark .wordmark .tech { color: var(--red); }
  #login-screen form {
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 2px;
    padding: 32px;
    width: 100%;
    max-width: 360px;
    box-shadow: 0 1px 2px rgba(7, 40, 89, 0.06), 0 8px 24px -12px rgba(7, 40, 89, 0.18);
  }
  #login-screen h2 {
    margin: 0 0 4px;
    font-size: 18px;
    font-weight: 800;
    color: var(--navy-deep);
  }
  #login-screen p.hint { color: #667085; font-size: 13px; margin: 0 0 20px; }
  label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #344054; }
  input[type="text"], input[type="password"], input[type="number"], input[type="date"],
  textarea, select {
    width: 100%;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 2px;
    font-size: 14px;
    font-family: inherit;
    background: #fff;
    color: var(--ink);
  }
  input:focus-visible, textarea:focus-visible, select:focus-visible {
    outline: 2px solid var(--red);
    outline-offset: 1px;
  }
  textarea { resize: vertical; }
  .field { margin-bottom: 16px; }
  button.primary {
    background: var(--red);
    color: #fff;
    border: none;
    padding: 10px 20px;
    border-radius: 2px;
    font-family: var(--font-display);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.03em;
    cursor: pointer;
    font-size: 13px;
  }
  button.primary:hover { background: var(--red-dark); }
  button.primary:disabled { opacity: .55; cursor: not-allowed; }
  button.ghost {
    background: #fff;
    border: 1px solid var(--border);
    padding: 9px 16px;
    border-radius: 2px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: var(--navy-deep);
  }
  button.ghost:hover { background: var(--navy-50); }
  button.danger { color: var(--red); border-color: #fbd2d1; }
  button.small { padding: 5px 10px; font-size: 12px; }
  #msg { min-height: 20px; font-size: 13px; margin-top: 10px; }
  #msg.err { color: var(--red-dark); }
  #msg.ok { color: #067647; }
  #app { display: none; }
  main {
    max-width: 1000px;
    margin: 0 auto;
    padding: 24px 20px 80px;
  }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; border-bottom: 1px solid var(--border); }
  .tabs button {
    background: none; border: none; padding: 10px 4px; margin-right: 16px;
    font-family: var(--font-display);
    font-weight: 700; font-size: 13px; color: #667085; cursor: pointer;
    text-transform: uppercase; letter-spacing: 0.02em;
    border-bottom: 2px solid transparent;
  }
  .tabs button.active { color: var(--navy-deep); border-color: var(--red); }
  .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .list-item {
    display: flex; justify-content: space-between; align-items: center;
    background: #fff; border: 1px solid var(--border); border-radius: 2px;
    padding: 12px 14px; margin-bottom: 8px; font-size: 14px;
  }
  .list-item .name { font-weight: 600; word-break: break-all; }
  .list-item .actions { display: flex; gap: 8px; flex-shrink: 0; margin-left: 12px; }
  #editor {
    background: #fff; border: 1px solid var(--border); border-radius: 2px; padding: 24px;
    box-shadow: 0 1px 2px rgba(7, 40, 89, 0.06), 0 8px 24px -12px rgba(7, 40, 89, 0.18);
  }
  #editor h2 { margin-top: 0; font-size: 18px; color: var(--navy-deep); font-weight: 800; }
  .repeat-group { border: 1px dashed var(--border); border-radius: 2px; padding: 12px; margin-bottom: 10px; }
  .repeat-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
  .repeat-row > div { flex: 1; }
  .img-preview { max-width: 160px; max-height: 100px; display: block; margin-top: 6px; border: 1px solid var(--border); border-radius: 2px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; }
  .checkbox-row input { width: auto; }
  .hint { color: #667085; font-size: 12px; margin-top: 4px; }
  .form-actions { display: flex; gap: 10px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(255,255,255,.4); border-top-color: #fff; border-radius: 50%; animation: spin .7s linear infinite; vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { color: #98a2b3; font-size: 14px; padding: 20px; text-align: center; }
</style>
</head>
<body>

<div id="login-screen">
  <div>
    <div class="brand-mark">
      <img src="/images/thuong-hieu/newtechcons-mark.png" alt="Logo Newtechcons" />
      <span class="wordmark"><span class="new">NEW</span><span class="tech">TECHCONS</span></span>
    </div>
    <form id="login-form">
      <h2>Quản trị nội dung</h2>
      <p class="hint">Đăng nhập để đăng và chỉnh sửa nội dung website.</p>
      <div class="field">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="primary" style="width:100%">Đăng nhập</button>
      <div id="login-msg"></div>
    </form>
  </div>
</div>

<div id="app">
  <header class="top">
    <div class="brand">
      <img src="/images/thuong-hieu/newtechcons-mark.png" alt="Logo Newtechcons" />
      <span class="wordmark"><span class="new">NEW</span><span class="tech">TECHCONS</span></span>
      <span class="sep">|</span>
      <span class="label">Quản trị nội dung</span>
    </div>
    <button id="logout-btn">Đăng xuất</button>
  </header>
  <main>
    <div class="tabs">
      <button data-collection="tin-tuc" class="active">Tin tức</button>
      <button data-collection="du-an">Dự án</button>
      <button data-collection="dich-vu">Dịch vụ</button>
    </div>

    <div id="list-view">
      <div class="toolbar">
        <div id="list-title" style="font-weight:700;font-size:15px;"></div>
        <button class="primary" id="new-btn">+ Thêm mới</button>
      </div>
      <div id="list-container"></div>
    </div>

    <div id="editor" style="display:none;"></div>

    <div id="msg"></div>
  </main>
</div>

<script src="/quan-tri/app.js"></script>
</body>
</html>
