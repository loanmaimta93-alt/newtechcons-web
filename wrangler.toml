## Cấu hình Cloudflare Pages cho website Newtechcons.
## Chỉ cần thiết nếu bạn deploy bằng lệnh CLI: `npx wrangler pages deploy dist`
## Nếu deploy qua Cloudflare Dashboard (kết nối repo Git) thì không cần file này,
## nhưng để sẵn cũng không ảnh hưởng gì — cứ giữ nguyên.

name = "newtechcons-web"
compatibility_date = "2026-01-01"
pages_build_output_dir = "dist"
